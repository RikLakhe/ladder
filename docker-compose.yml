services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ladder
      POSTGRES_PASSWORD: ladder
      POSTGRES_DB: ladder
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladder"]
      interval: 1s
      retries: 30

  db-qa:
    image: postgres:16
    environment:
      POSTGRES_USER: ladder
      POSTGRES_PASSWORD: ladder
      POSTGRES_DB: ladder_qa
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ladder"]
      interval: 1s
      retries: 30
